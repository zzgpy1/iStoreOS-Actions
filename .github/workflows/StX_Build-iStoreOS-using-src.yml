name: 💿 StX_Build-iStoreOS-using-src

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、请选择设备型号"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: choice
        options:
          - a311d-oes_s922x-oes-plus_wxy-oect
          - nsy-g16-plus_nsy-g68-plus_bdy-g18-pro
          - s905d_s905x3_s912_s922x-ct2000
          # ...（为节省篇幅，省略其余选项，您照常复制全部即可）
      openwrt_kernel:
        description: "2、请选择内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean

env:
  VERSION: 24.10.7

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载 rootfs.tar.gz
        id: download
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz
          # 校验文件是否为 gzip 压缩包
          file bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz
          ls -lh bin/targets/armsr/armv8/

      - name: 🧱 打包 iStoreOS 固件（使用官方动作）
        id: package
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          # 使用绝对路径，避免相对路径歧义
          openwrt_path: ${{ github.workspace }}/bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      - name: 🔍 深度调试 - 定位固件产物
        id: locate
        run: |
          echo "=== 1. 列出当前工作目录全部文件（递归） ==="
          find . -type f -printf "%p\n" | head -100

          echo "=== 2. 搜索所有 .img.gz 文件 ==="
          IMG_GZ_FILES=$(find . -type f -name "*.img.gz")
          if [ -n "$IMG_GZ_FILES" ]; then
            echo "找到以下 .img.gz 文件："
            echo "$IMG_GZ_FILES"
            # 取第一个文件所在目录作为输出目录
            FIRST_FILE=$(echo "$IMG_GZ_FILES" | head -n1)
            OUTPUT_DIR=$(dirname "$FIRST_FILE")
            echo "packaged_outputpath=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          else
            echo "❌ 未找到任何 .img.gz 文件"
            echo "=== 3. 尝试列出 out/ 目录（如果存在） ==="
            ls -la out/ 2>/dev/null || echo "out/ 目录不存在"
            echo "=== 4. 列出整个工作区目录树（限于深度3） ==="
            sudo apt-get install -y tree || true
            tree -L 3 . || ls -R .
            exit 1
          fi

      - name: 📜 调整 .img.gz 文件名
        if: steps.locate.outputs.packaged_outputpath != ''
        run: |
          OUTPUT_DIR="${{ steps.locate.outputs.packaged_outputpath }}"
          echo "📁 使用目录：$OUTPUT_DIR"
          for FILE in "$OUTPUT_DIR"/*.img.gz; do
            [ -e "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            mv "$FILE" "$OUTPUT_DIR/$NEW_FILENAME"
            echo "Renamed $FILENAME to $NEW_FILENAME"
          done
          # 再次列出重命名后文件
          ls -la "$OUTPUT_DIR"/

      - name: 🚀 上传到 Release
        if: steps.locate.outputs.packaged_outputpath != ''
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-SNAPSHOT-dhcp
          body: |
            🔄 版本： iStoreOS-${{ env.VERSION }}-SNAPSHOT（源码编译后构建，插件集成适度精简）
            📂 来源： https://github.com/istoreos/istoreos
            🧠 内核： Please Login to iStoreOS → System → Amlogic Service → Replace the Kernel
            🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等
            👤 用户名： root
            🔒 密码： 无
            🌐 IP： 单网口-动态获取（从上级路由找寻）；多网口-IP：192.168.100.1
          files: |
            ${{ steps.locate.outputs.packaged_outputpath }}/*.img.gz
