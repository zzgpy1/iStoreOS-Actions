name: 💿 StX_Build-iStoreOS-using-src

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_board:
        description: "1、请选择设备型号"
        required: true
        default: "s905d_s905x3_s912_s922x-ct2000"
        type: choice
        options:
          # 此处省略了所有选项以节省篇幅，请保留您原有的全部选项列表
          - a311d-oes_s922x-oes-plus_wxy-oect
          # ... 您的所有选项
      openwrt_kernel:
        description: "2、请选择内核版本"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - 6.6.y
          - 6.12.y
          - 6.18.y
      auto_kernel:
        description: "自动使用最新内核-未匹配则自动"
        required: false
        default: true
        type: boolean

env:
  VERSION: 24.10.7
  ROOTFS_URL: https://github.com/Kwonelee/Rootfs-Actions/releases/download/generic-rootfs/istoreos-armsr-armv8-generic-rootfs.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: ⏬ 下载 rootfs.tar.gz
        run: |
          echo "📦 正在下载预构建 rootfs"
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            "${ROOTFS_URL}"
          echo "✅ 下载完成，文件信息："
          ls -lh bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz

      - name: 🔍 检查 rootfs 内容（解压后列出前20项）
        run: |
          echo "=== 列出 rootfs 压缩包内文件列表（前20个） ==="
          tar -tzf bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz | head -20
          if [ $? -ne 0 ]; then
            echo "❌ 压缩包损坏或无效，请检查下载链接。"
            exit 1
          fi

      - name: 🧱 打包iStoreOS固件（使用官方动作）
        id: package
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ github.workspace }}/bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: kwonelee

      # ========== 新增步骤：从动作的工作目录中提取产物 ==========
      - name: 📂 复制产物到当前工作区
        id: copy_artifacts
        run: |
          # 动作的工作目录
          ACTION_DIR="/home/runner/work/_actions/ophub/amlogic-s9xxx-openwrt/main"
          # 产物所在路径（动作内部输出目录）
          SOURCE_DIR="${ACTION_DIR}/openwrt/out"
          
          if [ -d "${SOURCE_DIR}" ]; then
            echo "✅ 找到产物目录: ${SOURCE_DIR}"
            ls -la "${SOURCE_DIR}"
            # 创建当前工作区的输出目录
            mkdir -p ./out
            # 复制所有 .img.gz 文件到当前工作区的 out/
            cp -v "${SOURCE_DIR}"/*.img.gz ./out/ || echo "没有 .img.gz 文件"
            # 检查是否复制成功
            if ls ./out/*.img.gz >/dev/null 2>&1; then
              echo "packaged=true" >> $GITHUB_OUTPUT
              echo "📦 已复制产物到 ./out/"
            else
              echo "❌ 未找到任何 .img.gz 文件，打包可能失败"
              echo "packaged=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "❌ 未找到产物目录 ${SOURCE_DIR}"
            echo "packaged=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # 原 check_output 步骤已由上述替代，可删除或保留但跳过检查
      # 为了简洁，直接在上一步完成判断

      - name: 📜 调整.img.gz 文件名
        if: steps.copy_artifacts.outputs.packaged == 'true'
        id: rename
        run: |
          OUTPUT_DIR="./out"
          echo "📁 处理文件目录：$OUTPUT_DIR"
          echo "packaged_outputpath=$OUTPUT_DIR" >> $GITHUB_OUTPUT
          for FILE in "$OUTPUT_DIR"/*.img.gz; do
            [ -e "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}/g')
            mv "$FILE" "$OUTPUT_DIR/$NEW_FILENAME"
            echo "Renamed $FILENAME to $NEW_FILENAME"
          done

      - name: 🚀 上传到 Release
        if: steps.copy_artifacts.outputs.packaged == 'true'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-SNAPSHOT-dhcp
          body: |
            🔄 版本： iStoreOS-${{ env.VERSION }}-SNAPSHOT（源码编译后构建，插件集成适度精简）
            📂 来源： https://github.com/istoreos/istoreos
            🧠 内核： Please Login to iStoreOS → System → Amlogic Service → Replace the Kernel
            🧩 集成： 包含了基础系统组件、驱动、网络工具、容器支持、LuCI界面及插件等
            👤 用户名： root
            🔒 密码： 无
            🌐 IP： 单网口-动态获取（从上级路由找寻）；多网口-IP：192.168.100.1
          files: |
            ${{ steps.rename.outputs.packaged_outputpath }}/*.img.gz
